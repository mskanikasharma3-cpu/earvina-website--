<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profit Share – Earnings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#f4f4f4;
}

.header {
  background:#111;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.card {
  background:white;
  padding:15px;
  margin:15px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.amount {
  font-size:34px;
  font-weight:bold;
  color:#27ae60;
}

.table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.table th, .table td {
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

.small {
  color:#666;
  font-size:14px;
}
</style>
</head>
<body>

<div class="header">Profit Share Earnings</div>

<div class="card">
  <div class="amount">₹0.00</div>
  <div class="small">Your total profit share</div>
</div>

<div class="card">
  <h3>Earning History</h3>

  <table class="table">
    <tr>
      <th>Date</th>
      <th>Source</th>
      <th>Amount</th>
    </tr>

    <tr>
      <td>—</td>
      <td>No data</td>
      <td>₹0</td>
    </tr>
  </table>
</div>

</body>
</html>
