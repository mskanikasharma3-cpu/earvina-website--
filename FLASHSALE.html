<style>
.flash-sale-page {
  max-width: 1200px;
  margin: auto;
  padding: 30px 20px;
  font-family: "Poppins", sans-serif;
  background: #f9f9f9;
}
.flash-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #ff4b2b, #ff416c);
  color: white;
  border-radius: 10px;
  padding: 15px 25px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}
.flash-header h1 {
  font-size: 1.8em;
  margin: 0;
}
.timer {
  font-weight: 600;
  background: white;
  color: #ff1744;
  padding: 5px 10px;
  border-radius: 6px;
}
.flash-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-top: 25px;
}
.flash-tile {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  overflow: hidden;
  text-align: center;
  position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.flash-tile:hover {
  transform: translateY(-5px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}
.flash-tile img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}
.flash-info {
  padding: 15px;
}
.flash-info h3 {
  font-size: 1em;
  color: #333;
  margin-bottom: 8px;
}
.flash-info .price {
  font-weight: 600;
  color: #ff1744;
}
.flash-info .old-price {
  text-decoration: line-through;
  color: #777;
  margin-left: 8px;
  font-size: 0.9em;
}
.discount-badge {
  background-color: #ff1744;
  color: white;
  font-size: 0.85em;
  font-weight: 600;
  padding: 5px 8px;
  border-radius: 6px;
  position: absolute;
  top: 10px;
  left: 10px;
}
.btn-group {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}
.copy-btn, .share-btn {
  background-color: #448aff;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85em;
  transition: 0.2s;
}
.copy-btn:hover, .share-btn:hover {
  background-color: #2979ff;
}
@media (max-width: 900px) {
  .flash-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 500px) {
  .flash-grid { grid-template-columns: 1fr; }
  .flash-header { flex-direction: column; text-align: center; }
}
</style>

<script>
// Flash Sale Timer
let countdownTime = 2 * 60 * 60 + 15 * 60 + 30;
const countdownElement = document.getElementById('countdown');
function updateTimer() {
  let h = Math.floor(countdownTime / 3600);
  let m = Math.floor((countdownTime % 3600) / 60);
  let s = countdownTime % 60;
  countdownElement.textContent = 
    `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  if (countdownTime > 0) countdownTime--;
}
setInterval(updateTimer, 1000);
updateTimer();

// Copy Link Function
function copyLink(link) {
  navigator.clipboard.writeText(link).then(() => {
    alert("🔗 Product link copied!");
  });
}

// Share Function
function shareLink(title, url) {
  if (navigator.share) {
    navigator.share({
      title: title,
      text: "Check out this great deal!",
      url: url
    }).catch(() => alert("Sharing canceled."));
  } else {
    alert("Sharing not supported on this browser.");
  }
}
function shareProduct(productId) {
  const product = productData.find(p => p.id === productId);
  if (!product) return;

  const shareData = {
    title: product.name,
    text: `Check out this ${product.brand} Jewelry! Only ₹${product.salePrice}! Profit: ₹${product.yourProfit}`,
    url: product.link
  };

  // ✅ Check if Web Share API is supported
  if (navigator.share) {
    navigator.share(shareData)
      .then(() => console.log('Shared successfully!'))
      .catch((err) => {
        console.error('Share failed:', err);
        alert('❌ Sharing failed. Try copying the link.');
        copyLink(productId);
      });
  } 
  // 💻 Desktop fallback
  else {
    // Try Clipboard API first
    if (navigator.clipboard) {
      navigator.clipboard.writeText(product.link)
        .then(() => alert('✅ Link copied! Share it manually.'))
        .catch(() => prompt('Copy this link:', product.link));
    } else {
      prompt('Copy this link:', product.link);
    }
  }
}

</script>
