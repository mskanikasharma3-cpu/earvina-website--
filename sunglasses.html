                navigator.share({
                    title: product.name,
                    text: `Check out these ${product.brand} Sunglasses! Only ${formatPrice(product.salePrice)}! Profit: ₹${product.yourProfit}`,

      z-index: 100;
    }
    .logo {
      font-size: 1.6em;
      font-weight: bold;
    }
    .logo span {
      color: #f7a01a;
    }
    .search-bar {
      display: flex;
      max-width: 400px;
      flex-grow: 1;
      margin: 0 20px;
    }
    .search-bar input {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px;
      outline: none;
    }
    .search-bar button {
      background-color: #f7a01a;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }
    .nav-item i {
      font-size: 1.5em;
      color: #333;
    }

    /* ---------- Layout ---------- */
    .main-content-wrapper {
      display: grid;
      grid-template-areas:
        "breadcrumb breadcrumb"
        "sidebar listing";
      grid-template-columns: 250px 1fr;
      gap: 20px;
      padding: 15px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ---------- Breadcrumb ---------- */
    .breadcrumb {
      grid-area: breadcrumb;
      font-size: 0.9em;
      color: #666;
    }
    .breadcrumb a {
      text-decoration: none;
      color: #555;
    }
    .current-page {
      font-weight: bold;
      color: #000;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      grid-area: sidebar;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      padding: 15px;
    }
    .sidebar h3 {
      font-size: 1.2em;
      margin-bottom: 15px;
    }
    .filter-group {
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }
    .filter-group h4 {
      font-size: 1em;
      color: #444;
      margin-bottom: 8px;
    }
    .price-range {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .price-range input {
      width: 80px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
    }
    .go-btn {
      padding: 6px 10px;
      background-color: #f7a01a;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .search-input {
      width: 100%;
      padding: 6px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .filter-options {
      list-style: none;
    }
    .filter-options li {
      margin: 5px 0;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-options input { accent-color: #f7a01a; }

    /* ---------- Product Listing ---------- */
    .product-listing {
      grid-area: listing;
    }
    .page-title {
      font-size: 1.6em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .deal-count {
      color: #555;
      margin-bottom: 15px;
    }
    .sort-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .sort-btn {
      border: 1px solid #ccc;
      background-color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .sort-btn:hover,
    .sort-btn.active {
      background-color: #f7a01a;
      color: #fff;
      border-color: #f7a01a;
    }

    /* ---------- Product Cards ---------- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }
    .product-card {
      background-color: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      text-align: center;
      transition: transform 0.2s ease;
    }
    .product-card:hover { transform: translateY(-4px); }
    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .product-details { text-align: left; }
    .product-details p { margin-bottom: 4px; }
    .sale-price { color: #e84c3d; font-weight: bold; }
    .discount { color: #2e7d32; font-size: 0.9em; }
    .actions {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }
    .copy-link-btn,
    .share-now-btn {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      font-size: 0.85em;
      cursor: pointer;
    }
    .copy-link-btn {
      background-color: #f0f0f0;
      border: 1px solid #ccc;
    }
    .share-now-btn {
      background-color: #4CAF50;
      color: #fff;
      border: none;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .main-content-wrapper {
        grid-template-areas:
          "breadcrumb"
          "listing"
          "sidebar";
        grid-template-columns: 1fr;
      }
      .sidebar {
        order: 2;
      }
      .price-range { flex-direction: column; align-items: flex-start; }
      .go-btn { width: 100%; margin-top: 5px; }
      .sort-options { flex-direction: column; }
      .sort-btn { width: 100%; }
    }

    @media (max-width: 480px) {
      header { flex-wrap: wrap; }
      .search-bar { margin: 10px 0; width: 100%; }
      .nav-item { margin-left: auto; }
      .product-card img { height: 150px; }
      .page-title { font-size: 1.3em; }
    }
  </style>
</head>

    function renderProducts(data) {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";
      data.forEach((p) => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${p.image}" alt="${p.name}">
            <div class="product-details">
              <p class="brand">${p.brand}</p>
              <p class="name">${p.name}</p>
              <p><span class="sale-price">₹${p.price}</span> 
              <span class="discount">(${p.discount}% OFF)</span></p>
            </div>
            <div class="actions">
              <button class="copy-link-btn" onclick="copyLink('#')">Copy Link</button>
              <button class="share-now-btn" onclick="shareProduct('${p.name}', '#')">
                <i class="fas fa-share-alt"></i> Share
              </button>
            </div>
          </div>`;
      });
      document.getElementById("deal-count-display").textContent = data.length;
    }

    function sortProducts(type, btn) {
      document.querySelectorAll(".sort-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      let sorted = [...sunglassesData];
      if (type === "high-price") sorted.sort((a, b) => b.price - a.price);
      else if (type === "low-price") sorted.sort((a, b) => a.price - b.price);
      else if (type === "discount") sorted.sort((a, b) => b.discount - a.discount);
      renderProducts(sorted);
    }

    function applyFilters() {
      const min = parseInt(document.getElementById("min-price").value);
      const max = parseInt(document.getElementById("max-price").value);
      const checkedBrands = [...document.querySelectorAll("#brand-filters input:checked")].map(b => b.value);
      const filtered = sunglassesData.filter(p =>
        p.price >= min && p.price <= max && checkedBrands.includes(p.brand)
      );
      renderProducts(filtered);
    }

    function copyLink(link) {
      navigator.clipboard.writeText(link);
      alert("✅ Link copied!");
    }

    function shareProduct(name, link) {
      if (navigator.share) navigator.share({ title: name, url: link });
      else alert("Share not supported on this device.");
    }

    function searchProducts() {
      const query = document.getElementById("searchBox").value.toLowerCase();
      const filtered = sunglassesData.filter(p =>
        p.name.toLowerCase().includes(query) || p.brand.toLowerCase().includes(query)
      );
      renderProducts(filtered);
    }

    renderProducts(sunglassesData);
  </script>
